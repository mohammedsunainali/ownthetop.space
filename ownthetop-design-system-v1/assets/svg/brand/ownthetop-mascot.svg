<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OwnTheTop Skyline Summit Mascot</title>
  <desc id="desc">Rounded light mascot with navy visor, blue skyline peaks and central gold summit.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F0FA"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FA9F5"/>
      <stop offset="1" stop-color="#1677E8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132A57"/>
      <stop offset="1" stop-color="#0D1B3D"/>
